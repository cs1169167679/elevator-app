name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          # 注意：这里去掉了 cache: 'gradle'，因为此时还没有 Android 目录

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install npm dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      # 关键步骤：将Gradle下载源替换为国内镜像
      - name: Change Gradle distribution URL to mirror
        run: |
          cd android
          cp gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties.bak
          sed -i 's#https\://services.gradle.org/distributions/#https\://mirrors.cloud.tencent.com/gradle/#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build APK (debug)
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elevator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
