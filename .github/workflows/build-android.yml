name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install npm dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Configure Gradle and Maven mirrors
        run: |
          cd android
          # 1. Gradle 下载镜像（腾讯云）
          sed -i 's#https\://services.gradle.org/distributions/#https\://mirrors.cloud.tencent.com/gradle/#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

          # 2. Maven 依赖镜像（阿里云），追加到 settings.gradle
          cat >> settings.gradle << 'EOF'

          // 阿里云 Maven 镜像加速
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: ./android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elevator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
