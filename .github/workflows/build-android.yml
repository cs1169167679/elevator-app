name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # 使用更稳定的JDK版本
          cache: 'gradle'   # 缓存Gradle依赖，加速后续构建

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install npm dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      # 关键步骤：将Gradle下载源替换为国内镜像
      - name: Change Gradle distribution URL to mirror
        run: |
          cd android
          # 备份原文件
          cp gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties.bak
          # 替换为腾讯云镜像，速度更快更稳定
          sed -i 's#https\\://services.gradle.org/distributions/#https\\://mirrors.cloud.tencent.com/gradle/#g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties # 打印修改后的文件确认

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build APK (debug)
        run: ./gradlew assembleDebug
        working-directory: ./android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elevator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
