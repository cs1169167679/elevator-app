<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>电梯维修助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="mainPage">
    <header id="appHeader">
      <h1 id="appTitle">电梯维修助手</h1>
      <div class="header-icons">
        <span id="settingsIcon">⚙️</span>
        <span id="lockIcon">🔒</span>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 搜索品牌或故障码...">
    </div>

    <section id="brandList" class="section"></section>
    <section id="contentArea" class="section"></section>

    <button id="addBtn" class="fab" style="display:none;">+</button>
  </div>

  <div id="brandDetail" style="display:none;">
    <div class="detail-header">
      <button id="backBtn">← 返回</button>
      <h2 id="detailBrandName"></h2>
      <button id="addCodeBtn" class="btn-add-code" style="display:none;">+ 添加</button>
    </div>
    <div class="search-bar" style="padding-top:12px;">
      <input type="text" id="codeSearchInput" placeholder="🔍 搜索故障码或定义...">
    </div>
    <div id="codeList" class="section"></div>
  </div>

  <div id="settingsPage" style="display:none;">
    <div class="detail-header">
      <button id="settingsBack">← 返回</button>
      <h2>设置</h2>
      <span style="width:60px;"></span>
    </div>

    <div class="settings-body">
      <div class="setting-card">
        <div class="setting-title">应用名称</div>
        <button class="setting-btn" id="renameBtn">📝 修改首页显示名称</button>
        <p class="setting-tip">提示：这里修改的是 App 内部显示的名称。桌面图标下的名字需要重新构建 APK 才能更改。</p>
      </div>

      <div class="setting-card">
        <div class="setting-title">字体大小</div>
        <div class="font-control">
          <button id="fontMinus">A-</button>
          <span id="fontLabel">标准</span>
          <button id="fontPlus">A+</button>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-title">数据备份与恢复</div>
        <button class="setting-btn" id="exportBtn">📤 导出全部数据到 Excel</button>
        <button class="setting-btn" id="importBtn">📥 从 Excel 导入数据（合并）</button>
        <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none;">
        <p class="setting-tip">提示：导入会与现有数据合并，同品牌同故障码以新文件为准，不会覆盖其他数据。</p>
      </div>

      <div class="setting-card">
        <div class="setting-title">关于</div>
        <p class="setting-tip" style="margin-top:0;">
          管理员密码：1111<br>
          删除密码：8888<br>
          数据保存在本机，不上传服务器。
        </p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button data-tab="brands" class="active">🏢 品牌</button>
    <button data-tab="favorites">⭐ 收藏</button>
    <button data-tab="experience">📝 经验</button>
    <button data-tab="debug">🔧 调试</button>
  </nav>

  <div id="adminModal" class="modal">
    <div class="modal-content">
      <h3>管理员验证</h3>
      <input type="password" id="adminPassword" placeholder="请输入密码" inputmode="numeric">
      <div class="modal-btns">
        <button id="adminConfirm">确认</button>
        <button id="adminCancel">取消</button>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h3>⚠️ 确认删除</h3>
      <p>此操作不可撤销，请输入密码：</p>
      <input type="password" id="deletePassword" placeholder="请输入删除密码" inputmode="numeric">
      <div class="modal-btns">
        <button id="deleteConfirm">确认删除</button>
        <button id="deleteCancel">取消</button>
      </div>
    </div>
  </div>

  <div id="contentModal" class="modal">
    <div class="modal-content">
      <h3 id="contentTitle"></h3>
      <p id="contentBody" style="white-space:pre-wrap; margin:12px 0; max-height:50vh; overflow-y:auto; color:#555; line-height:1.6;"></p>
      <div class="modal-btns">
        <button id="contentEditBtn" style="display:none;">✏️ 编辑</button>
        <button id="contentClose" style="background:#eee; color:#333;">关闭</button>
      </div>
    </div>
  </div>

  <div id="inputModal" class="modal">
    <div class="modal-content">
      <h3 id="inputTitle">请输入</h3>
      <input type="text" id="inputField" placeholder="" style="letter-spacing:0; text-align:left;">
      <div class="modal-btns">
        <button id="inputConfirm">确认</button>
        <button id="inputCancel" style="background:#eee; color:#333;">取消</button>
      </div>
    </div>
  </div>

  <script src="libs/localforage.min.js"></script>
  <script src="libs/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
